{% extends 'base.html' %}

{% block title %}Авторы{% endblock %}

{% block content %}
  <h1>Авторы</h1>
  {% for author in authors %}
    <div class='card'>
      <a href='{{ author.get_absolute_url }}'>{{ author.name }}</a>
      <span class='muted'>— книг: {{ author.books.count }}</span>
    </div>
  {% empty %}
    <p>Авторов пока нет.</p>
  {% endfor %}
  <p><a href='{% url 'catalog:author_create' %}'>Добавить автора</a></p>
{% endblock %}
