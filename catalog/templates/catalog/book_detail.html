<!-- catalog/templates/catalog/book_detail.html -->
{% extends 'base.html' %}
{% block title %}
    {{ book.title }}
{% endblock %}
{% block content %}
    <h1>{{ book.title }}</h1>
    <p>Автор: {{ book.author }}. Год издания: {{ book.year }}. Рейтинг: {{ book.rating }}</p>
    <p><a href='{% url 'catalog:book_list' %}'>← К каталогу</a></p>
{% endblock %}
