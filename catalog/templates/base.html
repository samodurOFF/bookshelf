<!-- templates/base.html -->
{% load static %}
<!doctype html>
<html lang='ru'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>{% block title %}Книжная полка{% endblock %}</title>
    <link rel='stylesheet' href='{% static 'css/style.css' %}'>
</head>
<body>
<header><a href='{% url 'catalog:home' %}'><strong>Книжная полка</strong></a>
    <nav>
        <a href='{% url 'catalog:book_list' %}'>Каталог</a>
        <a href='{% url 'catalog:book_create' %}'>Добавить книгу</a>
        <a href='{% url 'catalog:author_list' %}'>Список авторов</a>
        <a href='{% url 'catalog:genre_list' %}'>Список жанров</a>
        <a href='{% url 'catalog:about' %}'>О проекте</a>
    </nav>
</header>
<main>
    {% if messages %}
        <ul class='messages'>
            {% for message in messages %}
                <li class='{{ message.tags }}'>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}
    {% block content %}
    {% endblock %}
</main>
<footer class='muted'>Учебный проект · Django</footer>
</body>
</html>
