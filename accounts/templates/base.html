    <form method='post' action='{% url 'accounts:logout' %}' class='inline'> {% csrf_token %}
        <button type='submit'>Выйти ({{ user.username }})</button>
    </form>{% else %} <a href='{% url 'accounts:login' %}'>Войти</a>
    <a href='{% url 'accounts:register' %}'>Регистрация</a>
{% endif %}
